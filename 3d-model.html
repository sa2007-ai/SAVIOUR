<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAVIOUR — 3D Interactive Model | Smart Campus Platform</title>
  <meta name="description" content="Interactive 3D model visualization of the SAVIOUR Smart Campus Assistance Platform.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- Three.js r128 core -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- OrbitControls from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #1e40af;
      --blue-bright: #3b82f6;
      --blue-light: #60a5fa;
      --amber: #f59e0b;
      --emerald: #10b981;
      --purple: #8b5cf6;
      --cyan: #06b6d4;
      --bg-deep: #020617;
      --glass: rgba(15, 23, 42, 0.7);
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg-deep);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      color: #f1f5f9;
    }

    #three-canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    /* ── Top HUD ─────────────────────────────── */
    #hud-top {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: linear-gradient(to bottom, rgba(2,6,23,0.9) 0%, transparent 100%);
      z-index: 100;
      pointer-events: none;
    }

    .hud-brand {
      display: flex; align-items: center; gap: 10px;
    }
    .hud-brand-shield {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #1e40af, #3b82f6);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      box-shadow: 0 0 20px rgba(59,130,246,0.5);
    }
    .hud-brand-text {
      font-size: 20px; font-weight: 800;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }
    .hud-brand-sub {
      font-size: 11px;
      color: #64748b;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .hud-tag {
      font-size: 12px;
      color: #60a5fa;
      background: rgba(59,130,246,0.1);
      border: 1px solid rgba(59,130,246,0.25);
      padding: 5px 14px;
      border-radius: 999px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* ── Bottom Controls HUD ─────────────────── */
    #hud-bottom {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      padding: 20px 24px;
      background: linear-gradient(to top, rgba(2,6,23,0.9) 0%, transparent 100%);
      z-index: 100;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      pointer-events: none;
    }

    .controls-hint {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    .hint-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      color: #94a3b8;
      background: rgba(15,23,42,0.7);
      border: 1px solid rgba(51,65,85,0.5);
      padding: 5px 12px;
      border-radius: 999px;
      backdrop-filter: blur(8px);
    }
    .hint-pill kbd {
      background: rgba(51,65,85,0.7);
      border: 1px solid #334155;
      padding: 1px 7px;
      border-radius: 5px;
      font-size: 10px;
      color: #e2e8f0;
      font-family: inherit;
    }

    /* ── Feature Panel HUD (right side) ─────── */
    #panel-list {
      position: fixed;
      right: 24px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: all;
    }

    .panel-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(15,23,42,0.75);
      border: 1px solid rgba(51,65,85,0.5);
      color: #94a3b8;
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      backdrop-filter: blur(10px);
      transition: all 0.2s ease;
      text-align: left;
      min-width: 150px;
    }
    .panel-btn:hover, .panel-btn.active {
      background: rgba(30,64,175,0.3);
      border-color: rgba(59,130,246,0.5);
      color: #93c5fd;
      box-shadow: 0 0 20px rgba(59,130,246,0.15);
    }
    .panel-btn .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── Stat counters ────────────────────────── */
    .stat-strip {
      display: flex;
      gap: 20px;
    }
    .stat-item {
      text-align: center;
    }
    .stat-num {
      font-size: 22px;
      font-weight: 800;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
    }
    .stat-label {
      font-size: 10px;
      color: #475569;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* ── Loading overlay ─────────────────────── */
    #loading-screen {
      position: fixed;
      inset: 0;
      background: #020617;
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      transition: opacity 0.6s ease;
    }
    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .loader-shield {
      width: 72px; height: 72px;
      background: linear-gradient(135deg, #1e40af, #7c3aed);
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 36px;
      animation: pulseShield 1.5s ease-in-out infinite;
      box-shadow: 0 0 40px rgba(59,130,246,0.4);
    }
    @keyframes pulseShield {
      0%, 100% { transform: scale(1); box-shadow: 0 0 40px rgba(59,130,246,0.4); }
      50% { transform: scale(1.08); box-shadow: 0 0 60px rgba(59,130,246,0.7); }
    }
    .loader-text {
      font-size: 22px;
      font-weight: 800;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }
    .loader-bar-wrap {
      width: 200px;
      height: 4px;
      background: rgba(51,65,85,0.5);
      border-radius: 999px;
      overflow: hidden;
    }
    .loader-bar {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #8b5cf6);
      border-radius: 999px;
      animation: loadBar 1.8s ease-in-out forwards;
    }
    @keyframes loadBar {
      0% { width: 0%; }
      30% { width: 40%; }
      70% { width: 75%; }
      100% { width: 100%; }
    }
    .loader-sub {
      font-size: 12px;
      color: #475569;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* back link */
    .back-link {
      position: fixed;
      top: 80px;
      left: 24px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: #64748b;
      font-size: 12px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 999px;
      background: rgba(15,23,42,0.7);
      border: 1px solid rgba(51,65,85,0.4);
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }
    .back-link:hover { color: #93c5fd; border-color: rgba(59,130,246,0.4); }
  </style>
</head>
<body>

  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="loader-shield">🛡️</div>
    <div class="loader-text">SAVIOUR 3D</div>
    <div class="loader-bar-wrap"><div class="loader-bar"></div></div>
    <div class="loader-sub">Building 3D Model…</div>
  </div>

  <!-- WebGL Canvas -->
  <canvas id="three-canvas"></canvas>

  <!-- TOP HUD -->
  <div id="hud-top">
    <div class="hud-brand">
      <div class="hud-brand-shield">🛡️</div>
      <div>
        <div class="hud-brand-text">SAVIOUR</div>
        <div class="hud-brand-sub">3D Interactive Model</div>
      </div>
    </div>
    <div class="hud-tag">WebGL · Three.js · Orbit</div>
  </div>

  <!-- BACK LINK -->
  <a href="./index.html" class="back-link">← Live App</a>

  <!-- RIGHT PANEL LIST -->
  <div id="panel-list">
    <button class="panel-btn active" data-panel="0">
      <span class="dot" style="background:#3b82f6"></span> Home / Auth
    </button>
    <button class="panel-btn" data-panel="1">
      <span class="dot" style="background:#10b981"></span> Lost & Found
    </button>
    <button class="panel-btn" data-panel="2">
      <span class="dot" style="background:#f59e0b"></span> Campus Report
    </button>
    <button class="panel-btn" data-panel="3">
      <span class="dot" style="background:#ef4444"></span> Emergency Help
    </button>
    <button class="panel-btn" data-panel="4">
      <span class="dot" style="background:#8b5cf6"></span> Admin Dashboard
    </button>
    <button class="panel-btn" data-panel="5">
      <span class="dot" style="background:#06b6d4"></span> Matching Engine
    </button>
  </div>

  <!-- BOTTOM HUD -->
  <div id="hud-bottom">
    <div class="controls-hint">
      <div class="hint-pill">🖱️ <span>Drag to Orbit</span></div>
      <div class="hint-pill">🔍 <span>Scroll to Zoom</span></div>
      <div class="hint-pill"><kbd>R</kbd> <span>Reset Camera</span></div>
      <div class="hint-pill"><kbd>A</kbd> <span>Auto-Rotate</span></div>
    </div>
    <div class="stat-strip">
      <div class="stat-item"><div class="stat-num">3</div><div class="stat-label">Architecture Levels</div></div>
      <div class="stat-item"><div class="stat-num">60%</div><div class="stat-label">AI Match Threshold</div></div>
      <div class="stat-item"><div class="stat-num">6</div><div class="stat-label">Departments</div></div>
      <div class="stat-item"><div class="stat-num">2</div><div class="stat-label">User Roles</div></div>
    </div>
  </div>

<script>
(function() {
  // ── Scene Setup ──────────────────────────────────────────
  const canvas = document.getElementById('three-canvas');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x020617);
  scene.fog = new THREE.FogExp2(0x020617, 0.022);

  const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
  camera.position.set(0, 2, 14);

  const controls = new THREE.OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.minDistance = 5;
  controls.maxDistance = 35;
  controls.maxPolarAngle = Math.PI * 0.85;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.5;
  controls.target.set(0, 0, 0);

  // ── Lights ────────────────────────────────────────────────
  scene.add(new THREE.AmbientLight(0xffffff, 0.3));

  const keyLight = new THREE.PointLight(0x3b82f6, 4, 40);
  keyLight.position.set(8, 10, 8);
  keyLight.castShadow = true;
  scene.add(keyLight);

  const fillLight = new THREE.PointLight(0x8b5cf6, 2.5, 30);
  fillLight.position.set(-8, 4, 6);
  scene.add(fillLight);

  const rimLight = new THREE.PointLight(0xf59e0b, 1.5, 25);
  rimLight.position.set(0, -6, -8);
  scene.add(rimLight);

  const topLight = new THREE.DirectionalLight(0xffffff, 0.6);
  topLight.position.set(0, 20, 0);
  scene.add(topLight);

  // ── Helper: rounded rect texture canvas ──────────────────
  function makeCanvasTexture(w, h, drawFn) {
    const cvs = document.createElement('canvas');
    cvs.width = w; cvs.height = h;
    const ctx = cvs.getContext('2d');
    drawFn(ctx, w, h);
    const tex = new THREE.CanvasTexture(cvs);
    return tex;
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  // ── Phone Body ────────────────────────────────────────────
  const phoneGroup = new THREE.Group();
  scene.add(phoneGroup);

  // Phone shell
  const phoneW = 2.1, phoneH = 4.2, phoneD = 0.18;
  const phoneGeo = new THREE.BoxGeometry(phoneW, phoneH, phoneD, 1, 1, 1);
  const phoneMat = new THREE.MeshPhysicalMaterial({
    color: 0x1e293b,
    metalness: 0.85,
    roughness: 0.15,
    clearcoat: 1,
    clearcoatRoughness: 0.05,
  });
  const phoneMesh = new THREE.Mesh(phoneGeo, phoneMat);
  phoneMesh.castShadow = true;
  phoneGroup.add(phoneMesh);

  // Screen glass
  const screenTex = makeCanvasTexture(512, 1024, (ctx, w, h) => {
    // Background gradient
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, '#0f172a');
    grad.addColorStop(1, '#020617');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    // Status bar
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fillRect(0, 0, w, 50);
    ctx.fillStyle = '#64748b';
    ctx.font = 'bold 18px system-ui';
    ctx.fillText('9:41', 30, 34);
    ctx.fillText('5G 📶 🔋', 340, 34);

    // App header
    ctx.fillStyle = 'rgba(30,64,175,0.6)';
    roundRect(ctx, 0, 50, w, 80, 0);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 28px system-ui';
    ctx.fillText('🛡️ SAVIOUR', 30, 104);

    // Hero section
    const heroGrad = ctx.createLinearGradient(0, 140, 0, 340);
    heroGrad.addColorStop(0, 'rgba(37,99,235,0.3)');
    heroGrad.addColorStop(1, 'rgba(139,92,246,0.2)');
    ctx.fillStyle = heroGrad;
    roundRect(ctx, 20, 140, w - 40, 200, 20);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.font = 'bold 22px system-ui';
    ctx.fillText('Find. Report.', 40, 195);
    ctx.fillText('Get Help.', 40, 225);
    ctx.fillStyle = 'rgba(148,163,184,0.8)';
    ctx.font = '16px system-ui';
    ctx.fillText('Smart Campus Assistance', 40, 260);

    // Shield icon
    ctx.fillStyle = 'rgba(59,130,246,0.6)';
    ctx.beginPath();
    ctx.arc(380, 215, 50, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = '48px system-ui';
    ctx.fillText('🛡️', 352, 236);

    // Feature cards
    const cards = [
      { icon: '🔎', label: 'Lost & Found', color: '#10b981', y: 360 },
      { icon: '📢', label: 'Campus Report', color: '#f59e0b', y: 510 },
      { icon: '🚨', label: 'Emergency Help', color: '#ef4444', y: 660 },
      { icon: '👤', label: 'My Profile', color: '#8b5cf6', y: 810 },
    ];
    cards.forEach(c => {
      ctx.fillStyle = `${c.color}22`;
      roundRect(ctx, 20, c.y, w - 40, 120, 16);
      ctx.fill();
      ctx.strokeStyle = `${c.color}66`;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.font = '36px system-ui';
      ctx.fillText(c.icon, 40, c.y + 75);
      ctx.font = 'bold 22px system-ui';
      ctx.fillText(c.label, 100, c.y + 60);
      ctx.fillStyle = c.color;
      ctx.font = '16px system-ui';
      ctx.fillText('Tap to open →', 100, c.y + 88);
    });

    // Bottom nav
    ctx.fillStyle = 'rgba(15,23,42,0.95)';
    ctx.fillRect(0, h - 100, w, 100);
    const navItems = ['🏠\nHome', '🔎\nFind', '📢\nReport', '🚨\nHelp', '👤\nProfile'];
    navItems.forEach((item, i) => {
      const nx = 50 + i * 92;
      ctx.fillStyle = i === 0 ? '#3b82f6' : '#475569';
      ctx.font = '28px system-ui';
      ctx.fillText(item.split('\n')[0], nx - 14, h - 58);
      ctx.font = 'bold 12px system-ui';
      ctx.fillText(item.split('\n')[1], nx - 18, h - 28);
    });
  });

  const screenGeo = new THREE.PlaneGeometry(phoneW - 0.2, phoneH - 0.4);
  const screenMat = new THREE.MeshBasicMaterial({ map: screenTex });
  const screenMesh = new THREE.Mesh(screenGeo, screenMat);
  screenMesh.position.z = phoneD / 2 + 0.001;
  phoneGroup.add(screenMesh);

  // Home button / notch
  const notchGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.05, 32);
  const notchMat = new THREE.MeshPhysicalMaterial({ color: 0x334155, metalness: 0.9, roughness: 0.1 });
  const notchMesh = new THREE.Mesh(notchGeo, notchMat);
  notchMesh.rotation.x = Math.PI / 2;
  notchMesh.position.set(0, -phoneH / 2 - 0.05, 0);
  phoneGroup.add(notchMesh);

  phoneGroup.position.set(0, 0, 0);

  // ── Floating Feature Panels ───────────────────────────────
  const panelDefs = [
    {
      label: 'Smart Matching Engine',
      icon: '🤖',
      color: '#06b6d4',
      desc: '60% threshold\nMulti-factor AI\nSimilarity scoring',
      pos: [5.5, 1.5, 1.5],
      rot: [0, -0.6, 0],
    },
    {
      label: 'Lost & Found',
      icon: '🔎',
      color: '#10b981',
      desc: '4 status stages\nPhoto uploads\nAuto notifications',
      pos: [5, -1.5, -1.5],
      rot: [0, -0.5, 0.05],
    },
    {
      label: 'Campus Issue Report',
      icon: '📢',
      color: '#f59e0b',
      desc: '6 departments\n4 academic years\nMailto dispatch',
      pos: [-5.5, 1.5, 1.5],
      rot: [0, 0.6, 0],
    },
    {
      label: 'Emergency Hotlines',
      icon: '🚨',
      color: '#ef4444',
      desc: '6 categories\nOne-touch call\nDirect tel: links',
      pos: [-5, -1.5, -1.5],
      rot: [0, 0.5, -0.05],
    },
    {
      label: 'Admin Dashboard',
      icon: '📊',
      color: '#8b5cf6',
      desc: '7 live metrics\nModeration table\nStatus management',
      pos: [0, 4.5, -2.5],
      rot: [0.3, 0, 0],
    },
    {
      label: 'Role-Based Access',
      icon: '🔐',
      color: '#f472b6',
      desc: 'Email prefix rules\nSHA-256 hashing\nSession management',
      pos: [0, -4.5, -2.5],
      rot: [-0.3, 0, 0],
    },
  ];

  const panelMeshes = [];

  panelDefs.forEach((pd, idx) => {
    const panelTex = makeCanvasTexture(512, 320, (ctx, w, h) => {
      // BG
      ctx.fillStyle = '#0f172a';
      roundRect(ctx, 0, 0, w, h, 24);
      ctx.fill();

      // Color accent bar
      ctx.fillStyle = pd.color;
      roundRect(ctx, 0, 0, w, 10, 0);
      ctx.fill();

      // Icon circle
      ctx.fillStyle = pd.color + '22';
      ctx.beginPath();
      ctx.arc(65, 80, 40, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = '38px system-ui';
      ctx.fillText(pd.icon, 45, 97);

      // Label
      ctx.fillStyle = '#f1f5f9';
      ctx.font = 'bold 26px system-ui';
      ctx.fillText(pd.label, 120, 70);

      // Desc lines
      ctx.fillStyle = '#64748b';
      ctx.font = '18px system-ui';
      pd.desc.split('\n').forEach((line, i) => {
        ctx.fillStyle = pd.color;
        ctx.fillText('▸', 120, 106 + i * 32);
        ctx.fillStyle = '#94a3b8';
        ctx.fillText(line, 145, 106 + i * 32);
      });

      // Bottom border glow
      const g = ctx.createLinearGradient(0, h - 4, w, h - 4);
      g.addColorStop(0, 'transparent');
      g.addColorStop(0.5, pd.color + 'aa');
      g.addColorStop(1, 'transparent');
      ctx.fillStyle = g;
      ctx.fillRect(0, h - 4, w, 4);
    });

    const geo = new THREE.PlaneGeometry(3.2, 2.0);
    const mat = new THREE.MeshBasicMaterial({ map: panelTex, transparent: true, opacity: 0.92 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(...pd.pos);
    mesh.rotation.set(...pd.rot);
    mesh.userData = { idx, basePos: [...pd.pos], baseRot: [...pd.rot] };
    scene.add(mesh);
    panelMeshes.push(mesh);

    // Panel edge glow ring
    const edgeGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(3.25, 2.05, 0.02));
    const edgeMat = new THREE.LineBasicMaterial({ color: pd.color, transparent: true, opacity: 0.35 });
    const edgeLine = new THREE.LineSegments(edgeGeo, edgeMat);
    edgeLine.position.set(...pd.pos);
    edgeLine.rotation.set(...pd.rot);
    scene.add(edgeLine);
  });

  // ── Connection Lines (phone → panels) ─────────────────────
  const lineMat = new THREE.LineBasicMaterial({
    color: 0x3b82f6,
    transparent: true,
    opacity: 0.18,
  });

  panelDefs.forEach(pd => {
    const pts = [
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(...pd.pos),
    ];
    const lineGeo = new THREE.BufferGeometry().setFromPoints(pts);
    scene.add(new THREE.Line(lineGeo, lineMat));
  });

  // ── Animated Node Spheres along connections ───────────────
  const nodeMat = new THREE.MeshBasicMaterial({ color: 0x60a5fa });
  const nodeGeo = new THREE.SphereGeometry(0.07, 12, 12);
  const nodes = panelDefs.map(pd => {
    const m = new THREE.Mesh(nodeGeo, nodeMat.clone());
    m.userData.from = new THREE.Vector3(0, 0, 0);
    m.userData.to = new THREE.Vector3(...pd.pos);
    m.userData.t = Math.random();
    scene.add(m);
    return m;
  });

  // ── Particle Field ─────────────────────────────────────────
  const PARTICLE_COUNT = 1800;
  const pGeo = new THREE.BufferGeometry();
  const pPos = new Float32Array(PARTICLE_COUNT * 3);
  const pCol = new Float32Array(PARTICLE_COUNT * 3);
  for (let i = 0; i < PARTICLE_COUNT * 3; i += 3) {
    pPos[i] = (Math.random() - 0.5) * 60;
    pPos[i + 1] = (Math.random() - 0.5) * 40;
    pPos[i + 2] = (Math.random() - 0.5) * 40;
    const c = Math.random();
    if (c < 0.5) {
      pCol[i] = 0.23; pCol[i + 1] = 0.51; pCol[i + 2] = 0.96;
    } else if (c < 0.8) {
      pCol[i] = 0.55; pCol[i + 1] = 0.36; pCol[i + 2] = 0.98;
    } else {
      pCol[i] = 0.96; pCol[i + 1] = 0.62; pCol[i + 2] = 0.07;
    }
  }
  pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
  pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
  const pMat = new THREE.PointsMaterial({
    size: 0.08,
    vertexColors: true,
    transparent: true,
    opacity: 0.55,
  });
  const particles = new THREE.Points(pGeo, pMat);
  scene.add(particles);

  // ── Ground / Platform ─────────────────────────────────────
  const groundGeo = new THREE.CircleGeometry(12, 64);
  const groundMat = new THREE.MeshPhysicalMaterial({
    color: 0x0f172a,
    metalness: 0.3,
    roughness: 0.8,
    transparent: true,
    opacity: 0.7,
  });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -5.5;
  ground.receiveShadow = true;
  scene.add(ground);

  // Ground ring
  const ringGeo = new THREE.RingGeometry(6.8, 7, 128);
  const ringMat = new THREE.MeshBasicMaterial({
    color: 0x3b82f6,
    transparent: true,
    opacity: 0.2,
    side: THREE.DoubleSide,
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = -5.48;
  scene.add(ring);

  // ── 3D Shield above phone ─────────────────────────────────
  const shieldShape = new THREE.Shape();
  shieldShape.moveTo(0, 1.0);
  shieldShape.quadraticCurveTo(0.8, 0.95, 0.85, 0.28);
  shieldShape.quadraticCurveTo(0.8, -0.55, 0, -1.0);
  shieldShape.quadraticCurveTo(-0.8, -0.55, -0.85, 0.28);
  shieldShape.quadraticCurveTo(-0.8, 0.95, 0, 1.0);

  const extSettings = { depth: 0.15, bevelEnabled: true, bevelSegments: 4, bevelSize: 0.04, bevelThickness: 0.04 };
  const shieldGeo = new THREE.ExtrudeGeometry(shieldShape, extSettings);
  const shieldMat = new THREE.MeshPhysicalMaterial({
    color: 0x1e3a8a, metalness: 0.75, roughness: 0.15,
    clearcoat: 1, clearcoatRoughness: 0.08,
    emissive: 0x1e40af, emissiveIntensity: 0.12,
  });
  const shieldMesh = new THREE.Mesh(shieldGeo, shieldMat);
  shieldMesh.position.set(0, 4, 0);
  shieldMesh.castShadow = true;
  scene.add(shieldMesh);

  const shieldRingGeo = new THREE.TorusGeometry(0.55, 0.025, 16, 64);
  const shieldRingMat = new THREE.MeshBasicMaterial({ color: 0x60a5fa, transparent: true, opacity: 0.8 });
  const shieldRing = new THREE.Mesh(shieldRingGeo, shieldRingMat);
  shieldRing.position.set(0, 4.2, 0.15);
  scene.add(shieldRing);

  // ── Panel Buttons ────────────────────────────────────────
  const panelBtns = document.querySelectorAll('.panel-btn');
  const cameraTargets = [
    { pos: [0, 2, 14], target: [0, 0, 0] },     // home
    { pos: [8, 0, 8],  target: [5, -1.5, -1.5] }, // lost found
    { pos: [-8, 2, 8], target: [-5.5, 1.5, 1.5] }, // campus
    { pos: [-8, 0, 8], target: [-5, -1.5, -1.5] }, // emergency
    { pos: [0, 8, 8],  target: [0, 4.5, -2.5] },  // admin
    { pos: [8, 2, 8],  target: [5.5, 1.5, 1.5] }, // matching
  ];

  panelBtns.forEach((btn, i) => {
    btn.addEventListener('click', () => {
      panelBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const ct = cameraTargets[i];
      animateCameraTo(ct.pos, ct.target);
    });
  });

  function animateCameraTo(targetPos, lookAtPos) {
    const startPos = camera.position.clone();
    const startTarget = controls.target.clone();
    const endPos = new THREE.Vector3(...targetPos);
    const endTarget = new THREE.Vector3(...lookAtPos);
    let t = 0;
    const dur = 1.4;
    const ease = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
    const startTime = performance.now();
    function step() {
      t = Math.min((performance.now() - startTime) / (dur * 1000), 1);
      const et = ease(t);
      camera.position.lerpVectors(startPos, endPos, et);
      controls.target.lerpVectors(startTarget, endTarget, et);
      controls.update();
      if (t < 1) requestAnimationFrame(step);
    }
    step();
  }

  // ── Keyboard shortcuts ────────────────────────────────────
  let autoRotate = true;
  document.addEventListener('keydown', e => {
    if (e.key === 'r' || e.key === 'R') {
      animateCameraTo([0, 2, 14], [0, 0, 0]);
      panelBtns.forEach(b => b.classList.remove('active'));
      panelBtns[0].classList.add('active');
    }
    if (e.key === 'a' || e.key === 'A') {
      autoRotate = !autoRotate;
      controls.autoRotate = autoRotate;
    }
  });

  // ── Resize ────────────────────────────────────────────────
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ── Animation Loop ─────────────────────────────────────────
  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();

    // Phone gentle float
    phoneGroup.position.y = Math.sin(t * 0.8) * 0.12;
    phoneGroup.rotation.y = Math.sin(t * 0.3) * 0.04;

    // Shield float above phone
    shieldMesh.position.y = 4 + Math.sin(t * 1.1 + 1) * 0.12;
    shieldMesh.rotation.z = Math.sin(t * 0.5) * 0.04;
    shieldRing.position.y = shieldMesh.position.y + 0.2;
    shieldRing.rotation.z = t * 0.6;

    // Panel gentle oscillation
    panelMeshes.forEach((pm, i) => {
      const bp = pm.userData.basePos;
      pm.position.y = bp[1] + Math.sin(t * 0.7 + i * 1.1) * 0.08;
    });

    // Animate nodes along connection lines
    nodes.forEach((n, i) => {
      n.userData.t = (n.userData.t + 0.003) % 1;
      const tt = n.userData.t;
      n.position.lerpVectors(n.userData.from, n.userData.to, tt);
      // Pulse alpha
      n.material.opacity = Math.sin(tt * Math.PI) * 0.85 + 0.15;
      n.material.transparent = true;
    });

    // Particle drift
    particles.rotation.y = t * 0.012;
    particles.rotation.x = Math.sin(t * 0.08) * 0.015;

    // Keylight orbit
    keyLight.position.x = Math.sin(t * 0.4) * 10;
    keyLight.position.z = Math.cos(t * 0.4) * 10;

    // Ring pulse
    ring.material.opacity = 0.1 + Math.sin(t * 1.2) * 0.1;

    controls.update();
    renderer.render(scene, camera);
  }

  // ── Hide Loading Screen ───────────────────────────────────
  setTimeout(() => {
    document.getElementById('loading-screen').classList.add('hidden');
    setTimeout(() => {
      document.getElementById('loading-screen').style.display = 'none';
    }, 700);
  }, 2000);

  animate();
})();
</script>
</body>
</html>
